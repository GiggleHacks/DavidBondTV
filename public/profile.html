<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="David Bond TV — home" style="text-decoration:none">
      <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
    </a>
    <div class="auth-widget" id="auth-widget"></div>
  </header>

  <div class="acc-page wide">
    <div class="acc-card" id="card">
      <p class="acc-sub" id="loading">Loading profile…</p>
    </div>
  </div>

  <script type="module">
    import { getJSON } from '/js/account.js';

    // Username comes from the pretty URL /u/<name> (or ?u=<name> fallback).
    function getUsername() {
      const m = /^\/u\/([^/]+)/.exec(location.pathname);
      if (m) return decodeURIComponent(m[1]);
      return new URLSearchParams(location.search).get('u') || '';
    }

    function fmtJoined(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
    }

    (async function start() {
      const name = getUsername();
      const card = document.getElementById('card');
      const data = name ? await getJSON(`/api/users/${encodeURIComponent(name)}`) : null;
      if (!data || !data.user) {
        card.replaceChildren();
        const h = document.createElement('h1'); h.textContent = 'Profile not found';
        const p = document.createElement('p'); p.className = 'acc-sub';
        p.textContent = 'This user doesn’t exist or hasn’t finished their profile.';
        card.append(h, p);
        return;
      }
      const u = data.user;
      document.title = `${u.username} — David Bond TV`;
      card.replaceChildren();

      const hero = document.createElement('div');
      hero.className = 'profile-hero';
      const img = document.createElement('img');
      img.src = u.avatarUrl; img.alt = `${u.username}'s avatar`;
      const meta = document.createElement('div');
      const h1 = document.createElement('h1'); h1.textContent = u.username;
      if (u.isAdmin) {
        const badge = document.createElement('span');
        badge.className = 'admin-badge lg';
        badge.title = 'Site administrator';
        badge.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8l4.5 3.2L12 4l5.5 7.2L22 8l-2 11H4L2 8z"/></svg><span>Admin</span>';
        h1.append(' ');
        h1.appendChild(badge);
      } else if (u.isMember) {
        const badge = document.createElement('span');
        badge.className = 'member-badge lg';
        badge.title = 'David Bond TV member';
        badge.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.98 6.09 20.33l1.13-6.57L2.45 9.14l6.6-.96z"/></svg><span>Member</span>';
        h1.append(' ');
        h1.appendChild(badge);
      }
      const joined = document.createElement('div'); joined.className = 'joined';
      joined.textContent = u.createdAt ? `Joined ${fmtJoined(u.createdAt)}` : '';
      meta.append(h1, joined);
      // Members get a subtle "Member since …" line under the join date.
      if (u.isMember && u.memberSince) {
        const since = document.createElement('div');
        since.className = 'member-since';
        since.textContent = `★ Member since ${fmtJoined(u.memberSince)}`;
        meta.append(since);
      }
      hero.append(img, meta);
      card.append(hero);

      if (u.about) {
        const about = document.createElement('div');
        about.className = 'profile-about';
        about.textContent = u.about;
        card.append(about);
      }
      if (u.link) {
        const a = document.createElement('a');
        a.className = 'profile-link';
        a.href = u.link; a.textContent = u.link;
        a.rel = 'nofollow noopener noreferrer'; a.target = '_blank';
        card.append(a);
      }
    }());
  </script>
  <script type="module" src="/js/auth-widget.js"></script>
  <script src="/js/age-gate.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
