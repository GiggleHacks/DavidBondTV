<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <div class="acc-page">
    <div class="acc-head">
      <a class="logo" href="/" style="text-decoration:none">
        <img class="logo-mark" src="/brand/mark.png" alt="" width="124" height="124" />
        <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
      </a>
    </div>
    <div class="acc-card">
      <h1>Choose a new password</h1>
      <p class="acc-sub">Pick a strong password you don't use elsewhere.</p>
      <form id="form" novalidate>
        <div class="acc-field">
          <label for="password">New password</label>
          <input class="acc-input" id="password" type="password" autocomplete="new-password" placeholder="At least 4 characters" />
        </div>
        <button class="acc-btn" id="submit" type="submit">Update password</button>
        <p class="acc-msg" id="msg" hidden></p>
      </form>
      <p class="acc-foot"><a href="/login.html">Back to sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { postJSON } from '/js/account.js';
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token') || '';
    function setMsg(t, kind) {
      const m = $('msg');
      if (!t) { m.hidden = true; return; }
      m.hidden = false; m.textContent = t; m.className = `acc-msg ${kind || ''}`.trim();
    }
    if (!token) setMsg('This reset link is missing its token. Request a new one.', 'error');
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submit').disabled = true;
      setMsg('');
      const r = await postJSON('/api/auth/reset', { token, password: $('password').value });
      if (r.ok && r.data.ok) {
        setMsg('Password updated! Redirecting to sign in…', 'ok');
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } else {
        setMsg(r.data.error || 'Could not update your password.', 'error');
        $('submit').disabled = false;
      }
    });
  </script>
  <script src="/js/age-gate.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
