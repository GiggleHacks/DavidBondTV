<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Bond TV — Browse</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <!-- Homepage header: the brand (avatar + wordmark) lives at the top of the
       permanent sidebar now, so the header carries only the auth widget on the
       right (plus the admin Upload button, injected by admin-link.js). -->
  <header class="site-header">
    <div class="auth-widget" id="auth-widget"></div>
  </header>

  <main class="browse">
    <div class="browse-chips">
      <span class="chip" data-sort="recent">Recently Uploaded</span>
      <span class="chip" data-sort="all">All</span>
    </div>
    <div class="browse-grid" id="grid"></div>
  </main>

  <script type="module" src="/js/browse.js"></script>
  <script type="module" src="/js/auth-widget.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/admin-link.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
