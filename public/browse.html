<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Bond TV — Browse</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <!-- Homepage header: the brand (avatar + wordmark) lives at the top of the
       permanent sidebar now, so the header carries only the auth widget on the
       right (plus the admin Upload button, injected by admin-link.js). -->
  <header class="site-header">
    <div class="auth-widget" id="auth-widget"></div>
  </header>

  <main class="browse">
    <div class="browse-bar">
      <div class="sort-wrap" id="sort-wrap">
        <button class="sort-btn" id="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="sort-label">Latest</span>
          <svg class="sort-chevron" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 6 8 10 12 6"/></svg>
        </button>
        <ul class="sort-menu" id="sort-menu" role="listbox" hidden>
          <li><button type="button" data-sort="recent"  role="option">Latest</button></li>
          <li><button type="button" data-sort="popular" role="option">Most Viewed</button></li>
          <li><button type="button" data-sort="oldest"  role="option">Oldest</button></li>
        </ul>
      </div>
    </div>
    <div class="browse-grid" id="grid"></div>
  </main>

  <script type="module" src="/js/browse.js"></script>
  <script type="module" src="/js/auth-widget.js"></script>
  <script type="module" src="/js/sidebar.js"></script>
  <script type="module" src="/js/admin-link.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/blur-toggle.js"></script>

  <script src="/js/footer.js"></script>
</body>
</html>
