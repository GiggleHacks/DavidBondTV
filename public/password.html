<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>David Bond TV — Private</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--bg, #0f0f14); }
    .gate-wrap { width: 100%; max-width: 380px; padding: 20px; box-sizing: border-box; }
    .gate-logo { text-align: center; margin-bottom: 32px; }
    .gate-logo .wm-pre { font-size: 14px; font-weight: 500; letter-spacing: .06em; color: var(--text-dim, #888); display: block; margin-bottom: 4px; }
    .gate-logo .wm-box { display: inline-block; background: var(--accent, #a855f7); color: #fff; font-size: 22px; font-weight: 900; letter-spacing: .04em; padding: 4px 12px; border-radius: 8px; }
    .gate-card { background: var(--surface, #18181f); border: 1px solid var(--border, rgba(255,255,255,.1)); border-radius: 16px; padding: 28px 24px; }
    .gate-card h1 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
    .gate-card p { margin: 0 0 20px; font-size: 13px; color: var(--text-dim, #888); }
    .gate-field { display: grid; gap: 10px; }
    .gate-input { width: 100%; box-sizing: border-box; background: var(--surface-2, #1e1e28); color: var(--text, #f0f0f5); border: 1px solid var(--border, rgba(255,255,255,.1)); border-radius: 10px; padding: 11px 14px; font: inherit; font-size: 15px; outline: none; }
    .gate-input:focus { border-color: var(--accent, #a855f7); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #a855f7) 22%, transparent); }
    .gate-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent, #a855f7); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .gate-btn:hover { opacity: .88; }
    .gate-btn:disabled { opacity: .5; cursor: not-allowed; }
    .gate-err { color: #f87171; font-size: 13px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <div class="gate-wrap">
    <div class="gate-logo">
      <span class="wm-pre">David Bond</span>
      <span class="wm-box">TV</span>
    </div>
    <div class="gate-card">
      <h1>Private preview</h1>
      <p>This site is currently private. Enter the password to continue.</p>
      <div class="gate-field">
        <input id="pw" type="password" class="gate-input" placeholder="Password" autocomplete="current-password" autofocus />
        <button id="submit" class="gate-btn" type="button">Continue</button>
        <div id="err" class="gate-err"></div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById('pw');
    const btn = document.getElementById('submit');
    const err = document.getElementById('err');
    const params = new URLSearchParams(location.search);
    const returnTo = params.get('return') || '/';

    async function attempt() {
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Checking…';
      try {
        const res = await fetch('/api/auth/sitepass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          location.replace(returnTo);
        } else {
          err.textContent = data.error || 'Wrong password.';
          btn.disabled = false;
          btn.textContent = 'Continue';
          input.select();
        }
      } catch {
        err.textContent = 'Connection error — try again.';
        btn.disabled = false;
        btn.textContent = 'Continue';
      }
    }

    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
  </script>
</body>
</html>
