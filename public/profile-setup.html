<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your profile — David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <div class="acc-page wide">
    <div class="acc-head">
      <a class="logo" href="/" style="text-decoration:none">
        <img class="logo-mark" src="/brand/mark.png" alt="" width="124" height="124" />
        <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
      </a>
    </div>
    <div class="acc-card">
      <h1>Set up your profile</h1>
      <p class="acc-sub">Choose a username and a profile photo to finish.</p>
      <form id="form" novalidate>
        <div class="acc-field">
          <label for="username">Username</label>
          <input class="acc-input" id="username" type="text" maxlength="20" autocomplete="off" placeholder="3-20 letters, numbers or _" />
        </div>

        <div class="acc-field">
          <label>Profile photo</label>
          <div class="avatar-upload-row">
            <img id="current" class="avatar-current" alt="Your avatar" src="" />
            <div>
              <button type="button" class="acc-btn acc-btn-ghost" id="upload-btn" style="width:auto">Upload a photo</button>
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <p style="color:var(--text-dim);font-size:12px;margin:8px 0 0">PNG, JPEG or WEBP · max 2 MB. Optional — if you skip it, we’ll use your initial.</p>
            </div>
          </div>
        </div>

        <button class="acc-btn" id="submit" type="submit">Save profile</button>
        <p class="acc-msg" id="msg" hidden></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { fetchMe, postJSON, initialAvatarDataUri } from '/js/account.js';
    const $ = (id) => document.getElementById(id);
    // null → no explicit photo: the account uses a generated initial avatar.
    let selected = null;

    function setMsg(t, kind) {
      const m = $('msg');
      if (!t) { m.hidden = true; return; }
      m.hidden = false; m.textContent = t; m.className = `acc-msg ${kind || ''}`.trim();
    }

    // While no photo is chosen, keep the preview in sync with the typed username.
    function refreshInitial() {
      if (selected === null) $('current').src = initialAvatarDataUri($('username').value.trim());
    }
    $('username').addEventListener('input', refreshInitial);

    $('upload-btn').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', async () => {
      const file = $('file').files[0];
      if (!file) return;
      setMsg('Uploading…');
      const res = await fetch('/api/profile/avatar', {
        method: 'POST', headers: { 'Content-Type': file.type }, body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        selected = data.value;
        $('current').src = data.url;
        setMsg('');
      } else {
        setMsg(data.error || 'Upload failed.', 'error');
      }
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submit').disabled = true;
      setMsg('');
      const r = await postJSON('/api/profile/setup', {
        username: $('username').value.trim(),
        avatar: selected,
      });
      if (r.ok && r.data.ok) {
        window.location.href = '/'; // back to the homepage after setup
      } else {
        setMsg(r.data.error || 'Could not save your profile.', 'error');
        $('submit').disabled = false;
      }
    });

    (async function start() {
      const me = await fetchMe();
      if (!me) { window.location.href = '/login.html'; return; }
      if (me.profileComplete) { window.location.href = '/account.html'; return; }
      refreshInitial();
    }());
  </script>
</body>
</html>
