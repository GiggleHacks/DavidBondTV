<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account settings — David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="David Bond TV — home" style="text-decoration:none">
      <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
    </a>
    <div class="auth-widget" id="auth-widget"></div>
  </header>

  <div class="acc-page wide">
    <div class="acc-card">
      <h1>Account settings</h1>
      <p class="acc-sub" id="email-line">&nbsp;</p>
      <form id="form" novalidate>
        <div class="acc-field">
          <label for="username">Username</label>
          <input class="acc-input" id="username" type="text" maxlength="20" autocomplete="off" readonly disabled />
          <p style="color:var(--text-dim);font-size:12px;margin:6px 0 0">Your username is permanent and can’t be changed.</p>
        </div>

        <div class="acc-field">
          <label>Profile photo</label>
          <div class="avatar-upload-row">
            <img id="current" class="avatar-current" alt="Your avatar" src="" />
            <div>
              <button type="button" class="acc-btn acc-btn-ghost" id="upload-btn" style="width:auto">Upload new photo</button>
              <button type="button" class="acc-btn acc-btn-ghost" id="use-initial-btn" style="width:auto">Use my initial</button>
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <p style="color:var(--text-dim);font-size:12px;margin:8px 0 0">PNG, JPEG or WEBP · max 2 MB.</p>
            </div>
          </div>
        </div>

        <div class="acc-field">
          <label for="about">About me</label>
          <textarea class="acc-textarea" id="about" maxlength="500" placeholder="Tell people a bit about yourself…"></textarea>
        </div>
        <div class="acc-field">
          <label for="link">Website or link (optional)</label>
          <input class="acc-input" id="link" type="url" placeholder="https://example.com" />
        </div>

        <button class="acc-btn" id="submit" type="submit">Save changes</button>
        <p class="acc-msg" id="msg" hidden></p>
      </form>
      <p class="acc-foot"><a id="view-profile" href="#">View my public profile</a></p>
    </div>

    <div class="acc-card" id="billing-card" style="margin-top:16px">
      <h2 style="margin-top:0">Membership</h2>
      <p class="acc-sub" id="billing-status">&nbsp;</p>
      <button class="acc-btn" id="billing-action" type="button" hidden></button>
    </div>
  </div>

  <script type="module">
    import { fetchMe, postJSON, initialAvatarDataUri } from '/js/account.js';
    const $ = (id) => document.getElementById(id);
    // undefined → photo unchanged; '' → revert to generated initial; else an upload value.
    let selected;
    let me = null;

    function setMsg(t, kind) {
      const m = $('msg');
      if (!t) { m.hidden = true; return; }
      m.hidden = false; m.textContent = t; m.className = `acc-msg ${kind || ''}`.trim();
    }

    $('use-initial-btn').addEventListener('click', () => {
      selected = '';
      $('current').src = initialAvatarDataUri(me && me.username);
    });

    $('upload-btn').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', async () => {
      const file = $('file').files[0];
      if (!file) return;
      setMsg('Uploading…');
      const res = await fetch('/api/profile/avatar', {
        method: 'POST', headers: { 'Content-Type': file.type }, body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        selected = data.value;
        $('current').src = data.url;
        setMsg('');
      } else {
        setMsg(data.error || 'Upload failed.', 'error');
      }
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submit').disabled = true;
      setMsg('');
      // Username is fixed after creation — never sent. Only About + link (+ avatar).
      const body = {
        about: $('about').value,
        link: $('link').value.trim(),
      };
      if (selected !== undefined) body.avatar = selected;
      const r = await postJSON('/api/profile/update', body);
      if (r.ok && r.data.ok) {
        setMsg('Saved!', 'ok');
        $('view-profile').href = `/u/${encodeURIComponent(r.data.user.username)}`;
      } else {
        setMsg(r.data.error || 'Could not save.', 'error');
      }
      $('submit').disabled = false;
    });

    function fmtDate(ms) {
      try { return new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
      catch { return ''; }
    }

    function renderBilling(user) {
      const m = user.membership;
      const status = $('billing-status');
      const action = $('billing-action');
      if (m && m.active) {
        let txt = 'Active member.';
        if (m.cancelAtPeriodEnd && m.currentPeriodEnd) txt = `Membership ends ${fmtDate(m.currentPeriodEnd)} — you keep access until then.`;
        else if (m.status === 'past_due') txt = 'Payment failed — please update your card to keep your membership.';
        else if (m.currentPeriodEnd) txt = `Active${m.interval ? ` · billed ${m.interval}ly` : ''} · renews ${fmtDate(m.currentPeriodEnd)}.`;
        status.textContent = txt;
        action.textContent = 'Manage billing';
        action.hidden = false;
        action.onclick = async () => {
          action.disabled = true;
          const r = await postJSON('/api/pay/stripe/portal', {});
          if (r.ok && r.data.url) { window.location.href = r.data.url; return; }
          action.disabled = false;
          setMsg(r.data.error || 'Could not open the billing portal.', 'error');
        };
      } else {
        status.textContent = 'You’re not a member yet. Unlock all exclusive videos.';
        action.textContent = 'Become a member';
        action.hidden = false;
        action.onclick = () => { window.location.href = '/membership.html'; };
      }
    }

    (async function start() {
      me = await fetchMe();
      if (!me) { window.location.href = '/login.html'; return; }
      if (!me.profileComplete) { window.location.href = '/profile-setup.html'; return; }
      $('email-line').textContent = me.email;
      $('username').value = me.username || '';
      $('about').value = me.about || '';
      $('link').value = me.link || '';
      $('current').src = me.avatarUrl || initialAvatarDataUri(me.username);
      $('view-profile').href = `/u/${encodeURIComponent(me.username)}`;
      renderBilling(me);
    }());
  </script>
  <script type="module" src="/js/auth-widget.js"></script>
</body>
</html>
