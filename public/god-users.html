<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Users</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar" id="admin-shell"></header>

    <main id="app">
      <!-- List view -->
      <section id="list-view" class="card">
        <div class="card-head">
          <h2>Users <span id="ucount" class="muted"></span></h2>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <select id="sort-by" class="user-sort" title="Sort users">
              <option value="created.desc">Newest signups</option>
              <option value="created.asc">Oldest signups</option>
              <option value="lastSeen.desc">Recently active</option>
              <option value="watch.desc">Most watched</option>
              <option value="name.asc">Name A–Z</option>
            </select>
            <a class="btn ghost" href="/api/admin/users/export.csv" download title="Download every captured email as CSV">Export emails (CSV)</a>
            <input id="search" placeholder="Search name or email" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px" />
          </div>
        </div>
        <div class="user-insight-strip">
          <div><b id="ui-total">0</b><span>Total users</span></div>
          <div class="hot"><b id="ui-emails">0</b><span>Emails captured</span></div>
          <div class="hot"><b id="ui-optins">0</b><span>Opt-in leads</span></div>
          <div><b id="ui-members">0</b><span>Members</span></div>
          <div><b id="ui-blocked">0</b><span>Blocked</span></div>
          <div><b id="ui-watch">0m</b><span>Watch time</span></div>
        </div>
        <div class="email-funnel" id="email-funnel" aria-label="Email capture funnel">
          <div class="ef"><b id="ef-captured">0</b><span>Emails captured</span><div class="efbar"><i id="ef-captured-bar" style="width:100%"></i></div><small>all accounts with an email</small></div>
          <div class="ef"><b id="ef-verified">0</b><span>Verified emails</span><div class="efbar"><i id="ef-verified-bar" style="width:0%"></i></div><small id="ef-verified-pct">—</small></div>
          <div class="ef"><b id="ef-members">0</b><span>Converted to members</span><div class="efbar"><i id="ef-members-bar" style="width:0%"></i></div><small id="ef-members-pct">—</small></div>
        </div>
        <div class="seg user-tabs" role="group" aria-label="User filter" style="margin-bottom:14px">
          <button type="button" class="active" data-filter="verified">Verified <span id="tab-verified-n"></span></button>
          <button type="button" data-filter="unverified">Unverified <span id="tab-unverified-n"></span></button>
          <button type="button" data-filter="optins">Opt-in leads <span id="tab-optins-n"></span></button>
          <button type="button" data-filter="all">All</button>
        </div>
        <div class="user-row user-row-head" style="cursor:default">
          <span></span><b>User</b><b>Country</b><b>Watched</b><b>Signed up</b><b>Status</b>
        </div>
        <div id="user-list"></div>
      </section>

      <!-- Detail view -->
      <section id="detail-view" class="card hidden">
        <button class="back-link" id="to-list">← All users</button>
        <div id="detail"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/admin-users.js"></script>
  <script type="module" src="/js/admin-shell.js"></script>
</body>
</html>
