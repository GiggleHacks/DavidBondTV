<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Upload</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
  <style>
    .banner { border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .banner.warn { background: color-mix(in srgb, #f59e0b 18%, transparent); border: 1px solid color-mix(in srgb, #f59e0b 40%, transparent); color: #fde68a; }

    /* --- Upload studio layout --- */
    .up-head { margin-bottom: 4px; }
    .up-head h2 { margin: 0; }

    .up-studio { display: flex; gap: 24px; align-items: stretch; margin-top: 18px; }
    .up-sidebar { width: 210px; flex: none; }
    .up-settings { display: grid; gap: 14px; }
    .up-field { display: grid; gap: 8px; }
    .up-label { font-size: 12px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--text-dim); }

    /* Segment pill controls */
    .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg-opt { flex: 1; }
    .seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .seg-opt span { display: block; padding: 7px 10px; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s, color .12s; white-space: nowrap; }
    .seg-opt:not(:first-child) span { border-left: 1px solid var(--border); }
    .seg-opt:has(input:checked) span { background: var(--accent); color: var(--accent-contrast); }
    .seg-opt:not(:has(input:checked)) span:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    .acc-select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; width: 100%; }
    .acc-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .field-note { color: var(--text-dim); font-size: 12px; }
    .cat-wrap { display: flex; align-items: center; gap: 8px; }

    /* Dropzone */
    .drop { position: relative; overflow: hidden; flex: 1; min-width: 0;
      border: 2px dashed color-mix(in srgb, var(--border) 80%, var(--accent) 12%); border-radius: 18px; padding: 28px 20px; text-align: center;
      color: var(--text-dim); transition: border-color .18s, background .18s, transform .18s; cursor: pointer;
      background:
        radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%),
        color-mix(in srgb, var(--surface-2) 45%, transparent); }
    .drop:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .drop.drag { border-color: var(--accent); border-style: solid; background:
        radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 72%),
        color-mix(in srgb, var(--accent) 8%, var(--surface-2)); color: var(--text); transform: scale(1.005); }
    .drop strong { color: var(--text); font-size: 15px; display: block; }
    .drop-ico { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .18s; }
    .drop.drag .drop-ico { transform: translateY(-3px); }
    .drop-ico svg { width: 22px; height: 22px; fill: var(--accent); }
    .drop-select { pointer-events: none; margin-top: 14px; }
    .drop-formats { margin-top: 6px; font-size: 11px; }

    @media (max-width: 700px) {
      .up-studio { flex-direction: column; }
      .up-sidebar { width: 100%; }
    }

    /* --- Job rows --- */
    .job { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
    .job:first-child { border-top: none; }
    .job .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--text-dim); }
    .job.uploading .dot { background: #3b82f6; animation: pulse 1s infinite; }
    .job.processing .dot { background: #f59e0b; animation: pulse 1s infinite; }
    .job.ready .dot { background: #22c55e; }
    .job.failed .dot { background: #ef4444; }
    @keyframes pulse { 50% { opacity: .35; } }
    .job .jbody { flex: 1; min-width: 0; }
    .job .jname { font-size: 12px; color: var(--text-dim); word-break: break-word; }
    .job .jtitle { font-weight: 700; margin-top: 2px; }
    .job .jdesc { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .job .jstats { font-family: inherit; font-size: 12px; letter-spacing: .3px; color: var(--accent); margin-top: 4px; }
    .retrobar {
      height: 10px; margin-top: 6px; padding: 2px; border-radius: 4px;
      background: #0b1120; border: 2px solid #05080f;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 2px 4px rgba(0,0,0,.5);
      image-rendering: pixelated; overflow: hidden;
    }
    .retrobar > i {
      display: block; height: 100%; width: 0; border-radius: 2px;
      background-image:
        repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 2px, transparent 2px, transparent 12px),
        linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, #fff) 0%, var(--accent) 52%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
      transition: width .3s steps(16, end);
    }
    .job.uploading .retrobar > i { animation: retro-pulse .8s steps(2, end) infinite; }
    @keyframes retro-pulse { 50% { filter: brightness(1.18); } }
    .job-thumb { width: 72px; height: 41px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex: none; }
    .job-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn.sm { padding: 6px 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar">
      <a class="logo" href="/" style="text-decoration:none"><span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span></a>
      <nav class="admin-nav">
        <a href="/god">Dashboard</a>
        <a href="/god-upload.html" class="active">Upload</a>
        <a href="/god-videos.html">Videos</a>
        <a href="/god-products.html">Products</a>
        <a href="/god-pricing.html">Pricing</a>
        <a href="/god-users.html">Users</a>
        <a href="/god-community.html">Community</a>
        <a class="back" href="/">← Site</a>
      </nav>
    </header>

    <main id="app">
      <section class="card">
        <div class="up-head">
          <h2>Upload</h2>
        </div>
        <div id="ffmpeg-banner" class="banner warn hidden">⚠ ffmpeg isn't installed on this server, so uploads can't be processed yet.</div>

        <div class="up-studio">
          <aside class="up-sidebar">
            <div class="up-settings">

              <div class="up-field">
                <span class="up-label">Visibility</span>
                <div class="seg" role="group" aria-label="Visibility">
                  <label class="seg-opt">
                    <input type="radio" name="vis" value="free" checked />
                    <span>Free</span>
                  </label>
                  <label class="seg-opt">
                    <input type="radio" name="vis" value="premium" />
                    <span>Premium</span>
                  </label>
                </div>
              </div>

              <div class="up-field" id="blur-row">
                <span class="up-label">Blur</span>
                <select id="blur" class="acc-select">
                  <option value="strong">Strong</option>
                  <option value="medium" selected>Medium</option>
                  <option value="off">Off</option>
                </select>
              </div>

              <div class="up-field">
                <span class="up-label">Publishing</span>
                <div class="seg" role="group" aria-label="Publishing">
                  <label class="seg-opt">
                    <input type="radio" name="sched" value="now" checked />
                    <span>Now</span>
                  </label>
                  <label class="seg-opt">
                    <input type="radio" name="sched" value="drip" />
                    <span>Schedule</span>
                  </label>
                </div>
                <select id="drip-interval" class="acc-select hidden">
                  <option value="86400000">Every 24 hours</option>
                  <option value="172800000">Every 48 hours</option>
                  <option value="259200000">Every 72 hours</option>
                  <option value="604800000">Once per week</option>
                </select>
              </div>

              <div class="up-field" id="category-row">
                <span class="up-label">Category</span>
                <div class="cat-wrap">
                  <select id="category" class="acc-select">
                    <option value="">Uncategorized</option>
                  </select>
                  <a href="/god-videos.html" class="field-note">Manage →</a>
                </div>
              </div>

            </div>
          </aside>

          <div id="drop" class="drop">
            <div class="drop-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4l-6 6h4v6h4v-6h4l-6-6zM5 18v2h14v-2H5z"/></svg></div>
            <strong>Drop videos here</strong>
            <div class="drop-formats">.mp4 · .mov · .m4v</div>
            <button type="button" class="btn drop-select">Select files</button>
          </div>
        </div>

        <input id="file" type="file" accept="video/mp4,video/quicktime,video/x-m4v,.mp4,.mov,.m4v" multiple class="hidden" />
      </section>

      <section id="jobs-card" class="card hidden">
        <h2>Recent uploads</h2>
        <div id="jobs"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
