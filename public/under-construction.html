<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .uc {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      text-align: center; padding: 24px;
    }
    .uc img { width: 96px; height: 96px; border-radius: 20px; image-rendering: pixelated; }
    .uc .logo-wm { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -.6px; }
    .uc .wm-pre { color: var(--text); }
    .uc .wm-box { background: var(--accent); color: var(--accent-contrast); border-radius: 6px; padding: 1px 9px 3px; margin-left: 6px; }
    .uc h1 { font-size: 22px; font-weight: 700; margin-top: 6px; }
    .uc p { color: var(--text-dim); font-size: 15px; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="uc">
    <img src="/brand/mark.png" alt="" onerror="this.style.display='none'" />
    <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
    <h1>Under Construction</h1>
    <p>We're busy building something great. Please check back again soon.</p>
  </main>
</body>
</html>
