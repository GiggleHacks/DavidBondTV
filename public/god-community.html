<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Community</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <!-- Dossier fonts (scoped to the visitor-profile panel via CSS). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar" id="admin-shell"></header>

    <main id="app">
      <section class="card">
        <div class="card-head">
          <h2>Community <span id="ccount" class="muted"></span></h2>
        </div>

        <!-- Summary stat strip -->
        <div class="stat-grid" id="summary" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px"></div>

        <!-- Filter bar -->
        <div class="comm-filters">
          <input id="search" placeholder="Search comments, names…" />
          <select id="video"><option value="">All videos</option></select>
          <select id="author">
            <option value="all">Everyone</option>
            <option value="registered">Registered users</option>
            <option value="anon">Anonymous</option>
            <option value="member">Members</option>
            <option value="admin">Admins</option>
            <option value="filtered">Filtered</option>
          </select>
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
          </select>
          <button id="clear" class="btn sm ghost" type="button">Clear</button>
        </div>

        <div id="comm-list"></div>
      </section>

      <section class="card" style="margin-top:16px">
        <div class="card-head">
          <h2>Comment settings</h2>
        </div>
        <div class="filter-admin">
          <label class="cf-anon" style="display:inline-flex;align-items:center;gap:8px">
            <input type="checkbox" id="anon-comments-toggle" disabled />
            Allow anonymous comments (visitors can post without an account)
          </label>
          <span id="anon-comments-status" class="muted"></span>
        </div>
      </section>

      <section class="card" style="margin-top:16px">
        <div class="card-head">
          <h2>Comment word filter</h2>
        </div>
        <div class="filter-admin">
          <form id="filter-form" class="comm-filters">
            <input id="filter-phrase" placeholder="Word or phrase to shadow ban" />
            <button class="btn sm" type="submit">Add phrase</button>
          </form>
          <div id="filter-list" class="filter-list"></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/admin-community.js"></script>
  <script type="module" src="/js/admin-shell.js"></script>
</body>
</html>
