<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Categories</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar" id="admin-shell"></header>
    <main>
      <section class="card">
        <div class="card-head">
          <h2>Categories</h2>
          <button class="btn sm" id="cat-new-btn" type="button">New category</button>
        </div>
        <div class="mv-filters">
          <input id="cat-search-admin" placeholder="Search categories" />
          <a class="btn sm ghost" href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-videos.html">Back to videos</a>
        </div>
        <div id="cat-admin-list" class="cat-admin-list"></div>
      </section>

      <dialog class="admin-dialog" id="cat-dialog">
        <form method="dialog" id="cat-form">
          <div class="card-head"><h2 id="cat-dialog-title">New category</h2><button class="btn sm ghost" value="cancel">Close</button></div>
          <input type="hidden" id="cat-slug" />
          <div class="form-grid">
            <label>Name<input id="cat-name" maxlength="40" /></label>
            <label>Icon
              <button class="cat-visual-trigger" id="cat-visual-trigger" type="button">
                <span id="cat-visual-preview" class="cat-visual-lg is-empty" aria-hidden="true">•</span>
                <span class="cat-visual-copy">
                  <b id="cat-visual-name">Choose icon</b>
                  <small id="cat-visual-help">Emoji, custom icons, and all country flags</small>
                </span>
                <span class="cat-visual-caret" aria-hidden="true">▾</span>
              </button>
            </label>
          </div>
          <p class="muted" id="cat-dialog-msg"></p>
          <div class="modal-actions">
            <button class="btn danger" id="cat-remove" type="button">Remove</button>
            <button class="btn" type="submit">Save category</button>
          </div>
        </form>
      </dialog>

      <dialog class="admin-dialog cat-picker-dialog" id="cat-picker-dialog">
        <div class="card-head">
          <h2>Choose icon</h2>
          <button class="btn sm ghost" id="cat-picker-close" type="button">Close</button>
        </div>
        <div class="cat-picker-top">
          <input id="cat-picker-search" placeholder="Search icons, emojis, or flags" />
          <button class="btn sm ghost" id="cat-picker-clear" type="button">No icon</button>
        </div>
        <div class="cat-picker-sections" id="cat-picker-sections"></div>
      </dialog>
    </main>
  </div>
  <script type="module" src="/js/admin-categories.js"></script>
  <script type="module" src="/js/admin-shell.js"></script>
</body>
</html>
