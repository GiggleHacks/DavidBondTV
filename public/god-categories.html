<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Categories</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar">
      <a class="logo" href="/" style="text-decoration:none"><span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span></a>
      <nav class="admin-nav">
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789">Dashboard</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-videos.html">Videos</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-products.html">Products</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-pricing.html">Pricing</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-categories.html" class="active">Categories</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-coupons.html">Coupons</a>
        <a class="back" href="/">← Site</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <div class="card-head">
          <h2>Categories</h2>
          <button class="btn sm" id="cat-new-btn" type="button">New category</button>
        </div>
        <div class="mv-filters">
          <input id="cat-search-admin" placeholder="Search categories" />
          <a class="btn sm ghost" href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-videos.html">Back to videos</a>
        </div>
        <div id="cat-admin-list" class="cat-admin-list"></div>
      </section>

      <dialog class="admin-dialog" id="cat-dialog">
        <form method="dialog" id="cat-form">
          <div class="card-head"><h2 id="cat-dialog-title">New category</h2><button class="btn sm ghost" value="cancel">Close</button></div>
          <input type="hidden" id="cat-slug" />
          <div class="form-grid">
            <label>Name<input id="cat-name" maxlength="40" /></label>
            <label>Sidebar icon<input id="cat-icon" maxlength="8" placeholder="🎬" /></label>
            <label>Country flag<select id="cat-flag"></select></label>
          </div>
          <p class="muted" id="cat-dialog-msg"></p>
          <div class="modal-actions">
            <button class="btn danger" id="cat-remove" type="button">Remove</button>
            <button class="btn" type="submit">Save category</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>
  <script type="module" src="/js/admin-categories.js"></script>
</body>
</html>
