<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Videos</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
</head>
<body>
  <div class="admin-wrap wide admin-app-shell">
    <header class="admin-bar">
      <a class="logo" href="/" style="text-decoration:none"><span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span></a>
      <nav class="admin-nav">
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789">Dashboard</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-upload.html">Upload</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-videos.html" class="active">Videos</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-products.html">Products</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-pricing.html">Pricing</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-categories.html">Categories</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-coupons.html">Coupons</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-users.html">Users</a>
        <a href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-community.html">Community</a>
        <a class="back" href="/">← Site</a>
      </nav>
    </header>

    <main id="app">
      <section class="card" id="publish-card" hidden>
        <div class="card-head">
          <h2>Publish to server</h2>
          <button id="publish-btn" class="btn sm">⬆ Publish to server</button>
        </div>
        <p class="muted" id="publish-target" style="margin:0 0 8px">Pushes processed videos (renditions, thumbnails, previews, storyboards) to production. The server does no transcoding.</p>
        <div id="publish-progress" class="pub-prog" hidden>
          <div class="pub-cur" id="pub-cur"></div>
          <div class="pub-bar"><i id="pub-fill"></i><b class="pub-pct" id="pub-pct">0%</b></div>
          <div class="pub-stats">
            <span id="pub-speed">—</span>
            <span id="pub-eta"></span>
            <span id="pub-bytes"></span>
            <span id="pub-count" style="margin-left:auto"></span>
          </div>
        </div>
        <div id="publish-status" class="muted"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Manage videos <span id="vcount" class="muted"></span></h2>
          <div class="mv-filters">
            <select id="state-filter" aria-label="Filter by state" title="Filter by state">
              <option value="">All states</option>
              <option value="draft-unapproved">Draft · Unapproved</option>
              <option value="draft-approved">Draft · Approved</option>
              <option value="published">Published (live)</option>
              <option value="processing">Processing</option>
              <option value="failed">Failed</option>
            </select>
            <select id="access-filter" aria-label="Filter by access type" title="Filter by access type">
              <option value="">All access</option>
              <option value="free">Free</option>
              <option value="premium">Premium</option>
            </select>
            <select id="cat-filter" aria-label="Filter by category" title="Filter by category"></select>
            <input id="search" placeholder="Search title" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px" />
            <a class="btn sm ghost" href="/gigglehacksclicking85hgfd7845789drghudr789rdhkjrtbi8r5eg9875g789-categories.html">Manage categories</a>
          </div>
        </div>

        <div class="reviewbar">
          <button class="btn sm" id="review-all" type="button">▶ Review all unapproved <span id="unapproved-count" class="muted"></span></button>
          <button class="btn sm ghost" id="review-selected" type="button">▶ Review selected</button>
          <span style="flex:1"></span>
          <button class="btn sm" id="publish-approved" type="button">⬆ Publish approved <span id="approved-count" class="muted"></span></button>
        </div>

        <div class="bulkbar">
          <label class="selall"><input type="checkbox" id="select-all" /> Select all</label>
          <span id="selcount" class="muted">0 selected</span>
          <span style="flex:1"></span>
          <button class="btn sm ghost" data-bulk="approve" title="Mark as approved — stays hidden until manually published">Approve</button>
          <button class="btn sm ghost" data-bulk="unapprove" title="Return to unapproved draft — requires re-approval before publishing">Unapprove</button>
          <button class="btn sm ghost" data-bulk="publish" title="Make live immediately — visible to eligible viewers">Publish</button>
          <button class="btn sm ghost" data-bulk="unpublish" title="Take offline — hides from viewers but stays in your library">Unpublish</button>
          <button class="btn sm ghost" data-bulk="premium" title="Restrict to premium (paid) members only">Make Premium</button>
          <button class="btn sm ghost" data-bulk="free" title="Make available to all visitors for free">Make Free</button>
          <span class="bulk-cat">
            <select id="bulk-cat-select" aria-label="Set category">
              <option value="">— category —</option>
            </select>
            <button class="btn sm ghost" id="bulk-cat-apply" title="Assign selected videos to this category">Set category</button>
          </span>
          <span class="bulk-blur">
            <select id="bulk-blur-level" aria-label="Thumbnail blur level">
              <option value="off">No blur</option>
              <option value="medium">Medium blur</option>
              <option value="strong">Strong blur</option>
              <option value="strongest">Strongest blur</option>
            </select>
            <button class="btn sm ghost" id="bulk-blur-apply">Apply blur</button>
          </span>
          <button class="btn sm danger" data-bulk="delete">Delete</button>
        </div>

        <div id="library"></div>
        <div id="pager" class="pager"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/admin-videos.js"></script>
  <script type="module" src="/js/publish.js"></script>
</body>
</html>
