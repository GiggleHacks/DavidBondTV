<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <script src="/vendor/hls.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="David Bond TV — home" style="text-decoration:none">
      <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
    </a>

    <div class="auth-widget" id="auth-widget"></div>
  </header>

  <main class="page">
    <div class="player" id="player" tabindex="0">
      <video id="video" playsinline></video>

      <div class="spinner" id="spinner" hidden></div>

      <div class="error-overlay" id="error" hidden>
        <p id="error-msg">Something went wrong.</p>
        <button class="retry-btn" id="retry-btn">Retry</button>
      </div>

      <button class="big-play" id="big-play" aria-label="Play"></button>

      <div class="gradient"></div>

      <div class="controls" id="controls">
        <div class="progress" id="progress">
          <div class="progress-thumb" id="thumb" hidden>
            <div class="thumb-img" id="thumb-img"></div>
            <span class="thumb-time" id="thumb-time">0:00</span>
          </div>
          <div class="progress-track">
            <div class="progress-buffered" id="buffered"></div>
            <div class="progress-played" id="played"></div>
            <div class="progress-scrubber" id="scrubber"></div>
          </div>
        </div>

        <div class="control-row">
          <button class="ctrl-btn" id="play-btn" aria-label="Play (k)"></button>
          <div class="volume" id="volume">
            <button class="ctrl-btn" id="mute-btn" aria-label="Mute (m)"></button>
            <div class="volume-slider" id="vol-slider">
              <div class="vol-fill" id="vol-fill"></div>
              <div class="vol-knob" id="vol-knob"></div>
            </div>
          </div>
          <span class="time" id="time">0:00 / 0:00</span>
          <span class="spacer"></span>
          <button class="ctrl-btn" id="settings-btn" aria-label="Settings"></button>
          <button class="ctrl-btn" id="fullscreen-btn" aria-label="Fullscreen (f)"></button>
        </div>

        <div class="settings-menu" id="settings-menu" hidden></div>
      </div>
    </div>

    <div class="video-meta">
      <h1 id="v-title">Loading…</h1>
      <div class="v-subrow">
        <span class="v-channel">David Bond TV <span class="check">✔</span></span>
        <button class="sub-btn" id="sub-btn" type="button" hidden>Subscribe</button>
        <span class="sub-count" id="sub-count"></span>
        <span class="v-date" id="v-date"></span>
        <div class="reactions" id="reactions"></div>
      </div>
      <p class="v-desc" id="v-desc"></p>
    </div>

    <section class="comments" id="comments">
      <h2 class="comments-title"><span id="comment-count">0</span> Comments</h2>

      <form class="comment-form" id="comment-form" novalidate>
        <div class="cf-row">
          <input id="cf-name" class="cf-input" type="text" placeholder="Your name" maxlength="60" autocomplete="off" />
          <label class="cf-anon"><input type="checkbox" id="cf-anon" /> Post anonymously</label>
        </div>
        <textarea id="cf-text" class="cf-text" placeholder="Add a comment…" maxlength="1000" rows="3"></textarea>
        <!-- Honeypot: hidden from humans; bots that fill it are silently dropped. -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
          <label>Leave this empty <input id="cf-hp" type="text" tabindex="-1" autocomplete="off" /></label>
        </div>
        <div class="cf-row cf-bottom">
          <span class="cf-challenge">
            <label id="cf-question" for="cf-answer">Loading…</label>
            <input id="cf-answer" class="cf-answer" type="text" inputmode="numeric" placeholder="?" maxlength="4" autocomplete="off" />
          </span>
          <button type="submit" class="cf-submit" id="cf-submit">Comment</button>
        </div>
        <p class="cf-msg" id="cf-msg" hidden></p>
      </form>

      <ul class="comment-list" id="comment-list"></ul>
    </section>
  </main>

  <script type="module" src="/js/player.js"></script>
  <script type="module" src="/js/subscribe.js"></script>
  <script type="module" src="/js/auth-widget.js"></script>
  <script src="/js/admin-link.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/age-gate.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
