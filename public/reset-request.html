<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — David Bond TV</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>
  <div class="acc-page">
    <div class="acc-head">
      <a class="logo" href="/" style="text-decoration:none">
        <img class="logo-mark" src="/brand/mark.png" alt="" width="124" height="124" />
        <span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span>
      </a>
    </div>
    <div class="acc-card">
      <h1>Reset your password</h1>
      <p class="acc-sub">Enter your email and we'll send you a reset link.</p>
      <form id="form" novalidate>
        <div class="acc-field">
          <label for="email">Email address</label>
          <input class="acc-input" id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="acc-field" id="challenge-field">
          <label for="answer">Quick check</label>
          <span class="acc-challenge">
            <label id="question" for="answer">Loading…</label>
            <input class="acc-input" id="answer" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="?" />
          </span>
        </div>
        <div class="acc-field" id="turnstile" hidden></div>
        <button class="acc-btn" id="submit" type="submit">Send reset link</button>
        <p class="acc-msg" id="msg" hidden></p>
      </form>
      <p class="acc-foot"><a href="/login.html">Back to sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { postJSON, loadChallenge, fetchAuthConfig, mountTurnstile, turnstileToken } from '/js/account.js';
    const $ = (id) => document.getElementById(id);
    let token = null;
    let useTurnstile = false;
    async function refresh() {
      const c = await loadChallenge();
      if (c) { token = c.token; $('question').textContent = c.question; }
      else $('question').textContent = 'Verification unavailable';
    }
    function setMsg(t, kind) {
      const m = $('msg');
      if (!t) { m.hidden = true; return; }
      m.hidden = false; m.textContent = t; m.className = `acc-msg ${kind || ''}`.trim();
    }
    async function init() {
      const cfg = await fetchAuthConfig();
      if (cfg.turnstileSiteKey) {
        useTurnstile = true;
        $('challenge-field').hidden = true;
        mountTurnstile($('turnstile'), cfg.turnstileSiteKey);
      } else {
        await refresh();
      }
    }
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submit').disabled = true;
      setMsg('');
      const payload = { email: $('email').value.trim() };
      if (useTurnstile) payload.turnstileToken = turnstileToken($('turnstile'));
      else { payload.answer = $('answer').value.trim(); payload.token = token; }
      const r = await postJSON('/api/auth/request-reset', payload);
      if (r.ok && r.data.ok) {
        $('form').reset();
        setMsg(r.data.message || 'If that email is registered, a reset link is on its way.', 'ok');
      } else {
        setMsg(r.data.error || 'Could not process that.', 'error');
      }
      if (!useTurnstile) { $('answer').value = ''; await refresh(); }
      else if (window.turnstile) { try { window.turnstile.reset(); } catch {} }
      $('submit').disabled = false;
    });
    init();
  </script>
</body>
</html>
