<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>David Bond TV — Edit video</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script>document.documentElement.classList.add('admin-auth-pending');</script>
  <style>
    .edit-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 720px) { .edit-grid { grid-template-columns: 1fr; } }
    .ev-thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--surface-2); position: relative; display: flex; align-items: center; justify-content: center; }
    .ev-thumb::before { content: ''; position: absolute; inset: 0; background: var(--thumb-bg, transparent) center/cover; filter: blur(20px) brightness(.5); transform: scale(1.18); }
    .ev-thumb img { position: relative; z-index: 1; max-width: 100%; max-height: 100%; object-fit: contain; }
    .ev-field { margin-bottom: 18px; }
    .ev-field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .ev-field input[type="text"], .ev-field textarea {
      width: 100%; box-sizing: border-box; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px;
    }
    .ev-field input:focus, .ev-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .ev-field textarea { resize: vertical; min-height: 110px; }
    .ev-cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .ev-cand { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: pointer; border: 2px solid transparent; padding: 0; }
    .ev-cand img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ev-cand:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    .ev-cand.selected { border-color: var(--accent); }
    .ev-cand.selected::after { content: '✓'; position: absolute; top: 4px; right: 5px; font-size: 12px; font-weight: 800; color: var(--accent-contrast); background: var(--accent); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .ev-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .ev-links { display: flex; gap: 10px; margin-top: 14px; }
    .ev-msg { font-size: 13px; }
    .ev-msg.ok { color: #4ade80; } .ev-msg.error { color: #f87171; }
    .ev-radios { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; }
    .ev-radios label { display: inline-flex; gap: 10px; align-items: center; cursor: pointer; min-height: 44px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--surface-2) 84%, transparent); }
    .ev-radios input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); }
    #ev-blur { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
    @media (max-width: 560px) { .ev-links > a, .ev-actions > button { width: 100%; } }
  </style>
</head>
<body>
  <div class="admin-wrap admin-app-shell">
    <header class="admin-bar">
      <a class="logo" href="/" style="text-decoration:none"><span class="logo-wm"><span class="wm-pre">David Bond</span><span class="wm-box">TV</span></span></a>
      <nav class="admin-nav">
        <a href="/god">Dashboard</a>
        <a href="/god-upload.html">Upload</a>
        <a href="/god-videos.html">Videos</a>
        <a href="/god-users.html">Users</a>
        <a class="back" href="/">← Site</a>
      </nav>
    </header>

    <main id="app">
      <section class="card">
        <div class="card-head"><h2>Edit video</h2></div>
        <div id="edit-missing" class="muted hidden">Video not found.</div>
        <div id="edit-body" class="edit-grid hidden">
          <div>
            <div class="ev-thumb" id="ev-thumb"><img id="ev-thumb-img" alt="" /></div>
            <div class="ev-field hidden" id="ev-cands-field" style="margin-top:14px">
              <label>Choose a thumbnail</label>
              <div class="ev-cands" id="ev-candidates"></div>
            </div>
            <div class="ev-field" style="margin-top:14px">
              <label>Or upload your own</label>
              <button class="btn ghost sm" type="button" id="ev-thumb-btn">Upload image…</button>
              <input id="ev-thumb-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
              <div class="muted" style="font-size:12px;margin-top:6px">PNG, JPEG or WEBP · up to 8 MB</div>
            </div>
          </div>
          <div>
            <div class="ev-field">
              <label for="ev-title">Title</label>
              <input id="ev-title" type="text" maxlength="200" placeholder="Video title" />
            </div>
            <div class="ev-field">
              <label for="ev-desc">Description</label>
              <textarea id="ev-desc" maxlength="2000" placeholder="Add a description…"></textarea>
            </div>
            <div class="ev-field">
              <label>Visibility</label>
              <div class="ev-radios">
                <label><input type="radio" name="ev-vis" value="free" /> Free</label>
                <label><input type="radio" name="ev-vis" value="premium" /> Premium (subscribers only)</label>
              </div>
            </div>
            <div class="ev-field hidden" id="ev-blur-field">
              <label for="ev-blur">Thumbnail blur</label>
              <select id="ev-blur">
                <option value="strong">Strong blur</option>
                <option value="medium">Medium blur</option>
                <option value="off">No blur</option>
              </select>
              <div class="muted" style="font-size:12px;margin-top:6px">Applied to premium thumbnails for non-subscribers.</div>
            </div>
            <div class="ev-field hidden" id="ev-sched-field">
              <label>Release</label>
              <div class="ev-actions">
                <span class="muted" id="ev-sched-text"></span>
                <button class="btn ghost sm" type="button" id="ev-publish-now">Publish now</button>
              </div>
            </div>
            <div class="ev-actions">
              <button class="btn" type="button" id="ev-save">Save changes</button>
              <span class="ev-msg" id="ev-msg"></span>
            </div>
            <div class="ev-links">
              <a class="btn ghost sm" id="ev-view" target="_blank" rel="noopener">View video</a>
              <a class="btn ghost sm" id="ev-analytics">Analytics</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/admin-edit.js"></script>
</body>
</html>
